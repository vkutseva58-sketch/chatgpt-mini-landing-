<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132f36"><title>Мост через туман</title><link rel="stylesheet" href="/mist-bridge.css?v=15"></head><body><header><a href="/" aria-label="На главную">←</a><div class="brand"><small>ИНЖЕНЕРНАЯ ЭКСПЕДИЦИЯ</small><b>Мост через туман</b></div><button id="level">01 / 03</button><div class="money"><small>БЮДЖЕТ</small><b id="money"></b></div><button id="pause" aria-label="Пауза">Ⅱ</button></header><main><canvas id="world" aria-label="Редактор моста. Рисуйте дорогу, балки и тросы. Касание пустого места создаёт свободный узел."></canvas><div class="story"><small id="chapter" hidden></small><select id="route" aria-label="Выбрать ущелье"><option value="0">01 / Каменные ворота</option><option value="1">02 / Большая река</option><option value="2">03 / Красный каньон</option></select><h1 id="title"></h1><p id="brief"></p></div><button id="weather" aria-pressed="true" aria-label="Буря в долине" title="Выключить бурю"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c5-4 18-3 18 1S5 10 5 8m2 5c4 2 11 1 11-1m-8 5c3 1 6 0 6-1m-3 4 2-1"/></svg><span>Буря</span></button><div class="telemetry"><span id="status" role="status" aria-live="polite">Ожидание проекта</span><b id="load">НАГРУЗКА —</b></div><div id="bays" aria-label="Состояние проекта"></div></main><footer><div class="materials" aria-label="Материал"><button data-material="road" title="Дорога: путь поезда, требует поддержки балками" aria-pressed="true"><i>═</i><span>Дорога<small>24 монеты / 100 ед.</small></span></button><button data-material="wood" title="Дерево: жёсткая балка, раскалывается при перегрузке" aria-pressed="false"><i>▱</i><span>Дерево<small>18 монет / 100 ед.</small></span></button><button data-material="steel" title="Сталь: прочная балка, гнётся под большой нагрузкой" aria-pressed="false"><i>╳</i><span>Сталь<small>35 монет / 100 ед.</small></span></button><button data-material="cable" title="Трос: работает на растяжение, провисает без нагрузки" aria-pressed="false"><i>⌁</i><span>Трос<small>12 монет / 100 ед.</small></span></button></div><div class="editor-tools"><button data-material="node" aria-pressed="false" title="Поставить свободный узел">＋ Узел</button><button data-material="erase" aria-pressed="false" title="Убрать элемент или пустой узел">⌫ Убрать</button><label class="grid-toggle"><input id="grid" type="checkbox" checked> Сетка</label><details class="precise"><summary>Соединить…</summary><div><label>От <select id="nodeStart" aria-label="Начальный узел"></select></label><label>До <select id="nodeEnd" aria-label="Конечный узел"></select></label><button id="connect">Соединить</button></div></details></div><div class="actions"><button id="undo" aria-label="Отменить изменение">↶</button><button id="hint">Схема</button><button id="survey" aria-label="Рассчитать нагрузку" title="Рассчитать нагрузку" aria-pressed="false">◉</button><button id="run">Запустить поезд <span>→</span></button></div><p class="help">Сначала дорога, затем укрепления. Рисуй касаниями или протягиванием. Золотые узлы — опоры, остальные свободные. Точка на балке соединяет её. ⌫ — убрать, ↶ — отменить.</p></footer><dialog id="modal"><div class="modal-inner"><small id="modalTag"></small><h2 id="modalTitle"></h2><p id="modalText"></p><button id="continue"></button><button id="retry" hidden>Улучшить этот мост</button></div></dialog><script src="/mist-bridge.js?v=15"></script></body></html>
