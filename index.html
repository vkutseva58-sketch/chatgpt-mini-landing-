<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="Модульный лендинг с собственной админкой.">
<title>Начало</title>
<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--text:#20251f;--muted:#6f746b;--accent:#b9dd68;--accentText:#243016;--line:#d9ddd3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}a{color:inherit}
header{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:900;letter-spacing:-.05em;text-decoration:none}.brand i{font-style:normal;color:var(--accent)}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:flex-end}nav a{text-decoration:none;font-size:14px}.admin-link{border:1px solid var(--line);padding:10px 14px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent)}
.mod{position:relative}.spacing-compact{padding:34px 0}.spacing-normal{padding:72px 0}.spacing-large{padding:96px 0}.tone-light{background:transparent;color:var(--text)}.tone-surface{background:var(--surface);color:var(--text)}.tone-accent{background:var(--accent);color:var(--accentText)}.tone-dark{background:var(--text);color:var(--surface)}.module-shell{border-radius:30px;padding:0}.tone-surface.module-shell,.tone-accent.module-shell,.tone-dark.module-shell{padding-left:42px;padding-right:42px}
.eyebrow{display:flex;align-items:center;gap:9px;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.14em}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}.tone-accent .eyebrow:before{background:var(--accentText)}.tone-dark .eyebrow:before{background:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px}.btn{min-height:50px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:760;font-size:14px;border:1px solid currentColor;transition:.2s ease}.btn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}.tone-dark .btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.tone-accent .btn.primary{background:var(--accentText);color:var(--accent);border-color:var(--accentText)}.btn.secondary{background:transparent;border-color:color-mix(in srgb,currentColor 28%,transparent)}.btn:hover{transform:translateY(-2px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:56px;align-items:end}.hero.center .hero-grid{grid-template-columns:1fr;text-align:center;justify-items:center}.hero.center .hero-copy{max-width:900px}.hero.center .eyebrow,.hero.center .btns{justify-content:center}.hero.center .hero-media{width:min(760px,100%);min-height:360px}.hero h1{font-size:clamp(54px,8.5vw,110px);line-height:.95;letter-spacing:-.072em;margin:22px 0 0;max-width:900px;font-weight:560}.hero p{font-size:18px;line-height:1.62;color:var(--muted);max-width:650px;margin:26px 0 30px}.tone-dark .hero p,.tone-dark .copy,.tone-dark .module-sub,.tone-dark .card p,.tone-dark .stat span,.tone-dark .quote-by{color:color-mix(in srgb,var(--surface) 67%,transparent)}.tone-accent .hero p,.tone-accent .copy,.tone-accent .module-sub,.tone-accent .card p,.tone-accent .stat span,.tone-accent .quote-by{color:color-mix(in srgb,var(--accentText) 70%,transparent)}
.hero-media{min-height:430px;border:1px solid color-mix(in srgb,var(--line) 84%,transparent);border-radius:28px;background:var(--surface);padding:24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.tone-dark .hero-media{background:color-mix(in srgb,var(--surface) 8%,transparent);border-color:color-mix(in srgb,var(--surface) 16%,transparent)}.tone-accent .hero-media{background:color-mix(in srgb,var(--surface) 45%,var(--accent));border-color:transparent}.visual{position:absolute;inset:0;background:radial-gradient(circle at 75% 22%,color-mix(in srgb,var(--accent) 76%,white),transparent 28%),linear-gradient(145deg,transparent 0 42%,color-mix(in srgb,var(--accent) 44%,white) 42% 60%,transparent 60%)}.hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.badge{position:relative;z-index:2;align-self:flex-start;padding:9px 12px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(10px);font-size:11px;font-weight:800;border:1px solid color-mix(in srgb,var(--line) 72%,transparent);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(var(--count,3),1fr);border-top:1px solid currentColor;border-bottom:1px solid currentColor;border-color:color-mix(in srgb,currentColor 18%,transparent)}.stat{padding:24px 18px 24px 0}.stat+.stat{border-left:1px solid color-mix(in srgb,currentColor 18%,transparent);padding-left:28px}.stat b{display:block;font-size:clamp(30px,4vw,46px);letter-spacing:-.05em}.stat span{font-size:12px;color:var(--muted)}
.module-head{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:28px}.module-head h2,.text-block h2,.split h2,.cta h2{font-size:clamp(38px,6vw,72px);line-height:.98;letter-spacing:-.06em;margin:0;font-weight:560}.module-sub{margin:0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px}.card{border:1px solid color-mix(in srgb,currentColor 16%,transparent);border-radius:24px;padding:24px;min-height:280px;background:var(--surface);color:var(--text);display:flex;flex-direction:column;justify-content:space-between}.tone-dark .card{background:color-mix(in srgb,var(--surface) 8%,transparent);color:var(--surface)}.tone-accent .card{background:color-mix(in srgb,var(--surface) 58%,var(--accent));color:var(--accentText)}.card .num{font-size:11px;font-weight:800;letter-spacing:.12em}.card h3{font-size:30px;letter-spacing:-.04em;margin:0 0 12px}.card p{margin:0;color:var(--muted);line-height:1.58;font-size:15px}
.text-block{text-align:left}.text-block.center{text-align:center}.text-inner{max-width:var(--textw,760px)}.text-block.center .text-inner{margin:auto}.text-block .eyebrow{margin-bottom:18px}.text-block.center .eyebrow{justify-content:center}.copy{font-size:18px;line-height:1.72;color:var(--muted);white-space:pre-line;margin:24px 0 0}
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center}.split.reverse .split-media{order:2}.split .eyebrow{margin-bottom:18px}.split .copy{margin-bottom:26px}.split-media{min-height:430px;border-radius:28px;overflow:hidden;border:1px solid color-mix(in srgb,currentColor 14%,transparent);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 75%,white),transparent 30%),var(--surface)}.split-media img{width:100%;height:100%;min-height:430px;object-fit:cover;display:block}
.cta{border-radius:30px}.cta-inner{display:grid;grid-template-columns:1fr .72fr;gap:40px;align-items:end}.cta.center .cta-inner{grid-template-columns:1fr;text-align:center;justify-items:center}.cta.center .eyebrow,.cta.center .btns{justify-content:center}.cta p{font-size:16px;line-height:1.65;margin:0 0 22px;color:color-mix(in srgb,currentColor 68%,transparent)}.cta .eyebrow{margin-bottom:18px}
.quote{text-align:center}.quote blockquote{font-family:Georgia,serif;font-size:clamp(34px,5vw,64px);line-height:1.1;letter-spacing:-.035em;margin:0 auto;max-width:960px}.quote-by{margin-top:20px;font-size:13px;color:var(--muted)}
.spacer{height:var(--space,72px)}.divider{height:1px;background:var(--line)}
footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);padding:24px 0 34px;color:var(--muted);font-size:12px}.loading{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--surface);padding:10px 14px;border-radius:999px;font-size:12px;z-index:10}
@media(min-width:901px){
 main{display:flex;flex-direction:column}
 main>.mod{order:50}
 main>.hero{order:10}
 main>.mod:has(>.stats){order:20}
 main>.mod:has(>.cards){order:30}
 main>.cta{order:40;margin-top:28px;margin-bottom:88px;isolation:isolate}
 .spacing-compact{padding-top:52px;padding-bottom:52px}
 .spacing-normal{padding-top:92px;padding-bottom:92px}
 .spacing-large{padding-top:120px;padding-bottom:120px}
 .hero-grid{align-items:center;gap:72px}
 .hero-copy,.hero-media{align-self:center}
 .hero-media{min-height:460px}
}
@media(max-width:900px){.hero-grid,.split-grid,.cta-inner{grid-template-columns:1fr}.split.reverse .split-media{order:0}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(odd){border-left:0;padding-left:0}.stat:nth-child(n+3){border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}}
@media(max-width:640px){.wrap{width:min(100% - 28px,1180px)}header{padding:14px 0;align-items:flex-start}.admin-link{display:none}nav{gap:10px}.spacing-compact{padding:26px 0}.spacing-normal{padding:52px 0}.spacing-large{padding:64px 0}.tone-surface.module-shell,.tone-accent.module-shell,.tone-dark.module-shell{padding-left:22px;padding-right:22px;border-radius:24px}.hero h1{font-size:clamp(48px,15vw,76px)}.hero-media,.split-media,.split-media img{min-height:320px}.cards,.stats{grid-template-columns:1fr}.stat+.stat,.stat:nth-child(odd){border-left:0;padding-left:0}.stat:nth-child(n+2){border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}.module-head{align-items:flex-start;flex-direction:column}.card{min-height:220px}.cta-inner{gap:24px}}
</style>
</head>
<body>
<div class="loading" id="loading">Загружаю сайт…</div>
<div class="wrap">
<header>
  <a class="brand" href="#top" id="brand">начало<i>↗</i></a>
  <nav id="nav"></nav>
</header>
<main id="top"></main>
<footer><span id="footerText"></span><a href="/admin.html">Админка ↗</a></footer>
</div>
<script>
(function(){
"use strict";
var fallbackColors={background:"#f4f1ea",surface:"#fffdf8",text:"#20251f",muted:"#6f746b",accent:"#b9dd68",accentText:"#243016",line:"#d9ddd3"};
var main=document.getElementById("top");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]})}
function safeUrl(v){var s=String(v||"").trim();if(!s)return "#";if(s.charAt(0)==="#"||s.charAt(0)==="/"||/^https?:\/\//i.test(s)||/^mailto:/i.test(s)||/^tel:/i.test(s))return s;return "#"}
function cls(m,extra){return "mod module-shell "+(extra||"")+" tone-"+(m.tone||"light")+" spacing-"+(m.spacing||"normal")}
function btn(text,url,kind){if(!text)return "";return '<a class="btn '+kind+'" href="'+esc(safeUrl(url))+'">'+esc(text)+'</a>'}
function renderHero(m){
 var image=m.image?'<img src="'+esc(m.image)+'" alt="'+esc(m.title||"")+'">':'<div class="visual"></div>';
 return '<section id="'+esc(m.id)+'" class="'+cls(m,"hero "+(m.layout==="center"?"center":""))+'"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">'+esc(m.eyebrow)+'</div><h1>'+esc(m.title)+'</h1><p>'+esc(m.text)+'</p><div class="btns">'+btn(m.primaryText,m.primaryUrl,"primary")+btn(m.secondaryText,m.secondaryUrl,"secondary")+'</div></div><div class="hero-media">'+image+(m.badge?'<div class="badge">'+esc(m.badge)+'</div>':'')+'</div></div></section>';
}
function renderStats(m){
 var items=m.items||[];return '<section id="'+esc(m.id)+'" class="'+cls(m,"")+'"><div class="stats" style="--count:'+Math.max(1,items.length)+'">'+items.map(function(x){return '<div class="stat"><b>'+esc(x.value)+'</b><span>'+esc(x.label)+'</span></div>'}).join("")+'</div></section>';
}
function renderCards(m){
 var cols=Math.max(2,Math.min(4,Number(m.columns)||3));
 return '<section id="'+esc(m.id)+'" class="'+cls(m,"")+'"><div class="module-head"><h2>'+esc(m.title)+'</h2><p class="module-sub">'+esc(m.eyebrow)+'</p></div><div class="cards" style="--cols:'+cols+'">'+(m.items||[]).map(function(x){return '<article class="card"><span class="num">'+esc(x.kicker)+'</span><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div></article>'}).join("")+'</div></section>';
}
function renderText(m){
 var width=m.width==="wide"?"980px":"760px";return '<section id="'+esc(m.id)+'" class="'+cls(m,"text-block "+(m.align==="center"?"center":""))+'"><div class="text-inner" style="--textw:'+width+'"><div class="eyebrow">'+esc(m.eyebrow)+'</div><h2>'+esc(m.title)+'</h2><div class="copy">'+esc(m.text)+'</div></div></section>';
}
function renderSplit(m){
 var image=m.image?'<img src="'+esc(m.image)+'" alt="'+esc(m.title||"")+'">':"";
 return '<section id="'+esc(m.id)+'" class="'+cls(m,"split "+(m.imageSide==="right"?"reverse":""))+'"><div class="split-grid"><div class="split-media">'+image+'</div><div><div class="eyebrow">'+esc(m.eyebrow)+'</div><h2>'+esc(m.title)+'</h2><div class="copy">'+esc(m.text)+'</div><div class="btns">'+btn(m.buttonText,m.buttonUrl,"primary")+'</div></div></div></section>';
}
function renderCta(m){
 return '<section id="'+esc(m.id)+'" class="'+cls(m,"cta "+(m.align==="center"?"center":""))+'"><div class="cta-inner"><div><div class="eyebrow">'+esc(m.eyebrow)+'</div><h2>'+esc(m.title)+'</h2></div><div><p>'+esc(m.text)+'</p><div class="btns">'+btn(m.buttonText,m.buttonUrl,"primary")+'</div></div></div></section>';
}
function renderQuote(m){
 return '<section id="'+esc(m.id)+'" class="'+cls(m,"quote")+'"><blockquote>“'+esc(m.quote)+'”</blockquote>'+(m.author?'<div class="quote-by">'+esc(m.author)+'</div>':'')+'</section>';
}
function renderSpacer(m){var map={small:32,medium:72,large:120};return '<div id="'+esc(m.id)+'" class="spacer" style="--space:'+(map[m.size]||72)+'px"></div>'+(m.divider?'<div class="divider"></div>':'')}
function renderModule(m){if(!m||m.enabled===false)return "";switch(m.type){case"hero":return renderHero(m);case"stats":return renderStats(m);case"cards":return renderCards(m);case"text":return renderText(m);case"split":return renderSplit(m);case"cta":return renderCta(m);case"quote":return renderQuote(m);case"spacer":return renderSpacer(m);default:return ""}}
function legacyModules(c){return [
 {id:"hero-main",type:"hero",enabled:true,tone:"light",spacing:"large",layout:"split",eyebrow:c.eyebrow,title:c.title,text:c.subtitle,primaryText:c.primaryButtonText,primaryUrl:c.primaryButtonUrl,secondaryText:c.secondaryButtonText,secondaryUrl:c.secondaryButtonUrl,badge:c.heroBadge,image:c.heroImage},
 {id:"stats-main",type:"stats",enabled:true,tone:"light",spacing:"compact",items:c.stats||[]},
 {id:"cards-main",type:"cards",enabled:true,tone:"light",spacing:"normal",columns:3,eyebrow:c.featuresSubtitle,title:c.featuresTitle,items:(c.features||[]).map(function(x){return{kicker:x.number,title:x.title,text:x.text}})},
 {id:"cta-main",type:"cta",enabled:true,tone:"dark",spacing:"normal",align:"left",eyebrow:c.contactEyebrow,title:c.contactTitle,text:c.contactText,buttonText:c.contactButtonText,buttonUrl:c.contactButtonUrl}
]}
function apply(c){
 var colors=Object.assign({},fallbackColors,c.colors||{}),root=document.documentElement.style;
 root.setProperty("--bg",colors.background);root.setProperty("--surface",colors.surface);root.setProperty("--text",colors.text);root.setProperty("--muted",colors.muted);root.setProperty("--accent",colors.accent);root.setProperty("--accentText",colors.accentText);root.setProperty("--line",colors.line);
 var brand=document.getElementById("brand");brand.textContent=c.brand||"Начало";brand.insertAdjacentHTML("beforeend","<i>↗</i>");
 var nav=document.getElementById("nav");var links=c.navLinks||[{label:c.navLabel||"О проекте",url:"#cards-main"}];nav.innerHTML=links.map(function(x){return '<a href="'+esc(safeUrl(x.url))+'">'+esc(x.label)+'</a>'}).join("")+'<a class="admin-link" href="/admin.html">Редактировать</a>';
 var modules=Array.isArray(c.modules)&&c.modules.length?c.modules:legacyModules(c);main.innerHTML=modules.map(renderModule).join("");
 document.getElementById("footerText").textContent=c.footerText||"";
 document.title=(c.brand||"Начало")+" — лендинг";
 var loading=document.getElementById("loading");if(loading)loading.remove();
}
fetch("./content.json?ts="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("load");return r.json()}).then(apply).catch(function(){apply({brand:"Начало",footerText:"© 2026 Начало",colors:fallbackColors,modules:[]})});
})();
</script>
</body>
</html>
