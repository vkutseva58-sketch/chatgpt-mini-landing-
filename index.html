<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="Начало — редактируемый лендинг с собственной админкой.">
<title>Начало</title>
<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--text:#20251f;--muted:#6f746b;--accent:#b9dd68;--accentText:#243016;--line:#d9ddd3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}.brand{font-size:24px;font-weight:900;letter-spacing:-.05em;text-decoration:none}.brand i{font-style:normal;color:var(--accent)}nav{display:flex;gap:18px;align-items:center}nav a{text-decoration:none;font-size:14px}.admin-link{border:1px solid var(--line);padding:10px 14px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent)}
.hero{padding:86px 0 78px}.eyebrow{display:flex;align-items:center;gap:9px;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.14em}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:56px;align-items:end;margin-top:25px}.hero h1{font-size:clamp(54px,8.5vw,110px);line-height:.95;letter-spacing:-.072em;margin:0;max-width:900px;font-weight:560}.hero p{font-size:18px;line-height:1.62;color:var(--muted);max-width:620px;margin:26px 0 30px}
.buttons{display:flex;flex-wrap:wrap;gap:10px}.btn{min-height:50px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:760;font-size:14px;border:1px solid var(--text);transition:.2s ease}.btn.primary{background:var(--text);color:var(--surface)}.btn.secondary{border-color:var(--line);background:var(--surface)}.btn:hover{transform:translateY(-2px)}
.hero-card{min-height:430px;border:1px solid var(--line);border-radius:28px;background:var(--surface);padding:24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.visual{position:absolute;inset:0;background:radial-gradient(circle at 75% 22%,color-mix(in srgb,var(--accent) 76%,white),transparent 28%),linear-gradient(145deg,transparent 0 42%,color-mix(in srgb,var(--accent) 44%,white) 42% 60%,transparent 60%);opacity:.95}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.hero-card.has-image .visual{display:none}.hero-card.has-image .hero-image{display:block}.badge{position:relative;z-index:2;align-self:flex-start;padding:9px 12px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(10px);font-size:11px;font-weight:800;border:1px solid color-mix(in srgb,var(--line) 72%,transparent)}.hero-card-bottom{position:relative;z-index:2;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 74%,transparent);padding:18px;border-radius:20px}.hero-card-bottom strong{display:block;font-size:24px;letter-spacing:-.04em}.hero-card-bottom span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.stat{padding:24px 0}.stat+.stat{border-left:1px solid var(--line);padding-left:28px}.stat b{display:block;font-size:34px;letter-spacing:-.05em}.stat span{font-size:12px;color:var(--muted)}
.section{padding:78px 0}.section-head{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:28px}.section h2{font-size:clamp(38px,6vw,72px);line-height:.98;letter-spacing:-.06em;margin:0;font-weight:560}.section-head p{margin:0;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.cards{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}.card{border:1px solid var(--line);border-radius:24px;padding:24px;min-height:300px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between}.card:first-child{background:var(--accent);color:var(--accentText);border-color:transparent}.card .num{font-size:11px;font-weight:800;letter-spacing:.12em}.card h3{font-size:30px;letter-spacing:-.04em;margin:0 0 12px}.card p{margin:0;color:var(--muted);line-height:1.58;font-size:15px}.card:first-child p{color:color-mix(in srgb,var(--accentText) 72%,transparent)}
.contact{margin-bottom:70px;border-radius:30px;background:var(--text);color:var(--surface);padding:54px;display:grid;grid-template-columns:1fr .72fr;gap:40px;align-items:end}.contact .eyebrow:before{background:var(--accent)}.contact h2{font-size:clamp(42px,6vw,76px);line-height:.98;letter-spacing:-.06em;margin:20px 0 0}.contact-side p{color:color-mix(in srgb,var(--surface) 68%,transparent);line-height:1.6;margin:0 0 22px}.contact .btn{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);padding:24px 0 34px;color:var(--muted);font-size:12px}
.loading{position:fixed;inset:auto 18px 18px auto;background:var(--text);color:var(--surface);padding:10px 14px;border-radius:999px;font-size:12px;z-index:10}
@media(max-width:820px){.wrap{width:min(100% - 28px,1180px)}.hero{padding:58px 0}.hero-grid{grid-template-columns:1fr;gap:34px}.hero-card{min-height:340px}.cards{grid-template-columns:1fr}.card{min-height:220px}.contact{grid-template-columns:1fr;padding:32px}.stats{grid-template-columns:1fr}.stat+.stat{border-left:0;border-top:1px solid var(--line);padding-left:0}.section-head{align-items:start;flex-direction:column}.admin-link{display:none}}
</style>
</head>
<body>
<div class="loading" id="loading">Загружаю контент…</div>
<div class="wrap">
<header>
  <a class="brand" href="#top" id="brand">начало<i>↗</i></a>
  <nav><a href="#features" id="navLabel">О проекте</a><a class="admin-link" href="/admin.html">Редактировать</a></nav>
</header>
<main id="top">
<section class="hero">
  <div class="eyebrow" id="eyebrow"></div>
  <div class="hero-grid">
    <div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <div class="buttons">
        <a class="btn primary" id="primaryButton"></a>
        <a class="btn secondary" id="secondaryButton"></a>
      </div>
    </div>
    <div class="hero-card" id="heroCard">
      <div class="visual"></div>
      <img class="hero-image" id="heroImage" alt="">
      <div class="badge" id="heroBadge"></div>
      <div class="hero-card-bottom"><strong>Content → Admin → GitHub</strong><span>Изменения публикуются без переписывания страницы</span></div>
    </div>
  </div>
</section>
<section class="stats" id="stats"></section>
<section class="section" id="features">
  <div class="section-head"><h2 id="featuresTitle"></h2><p id="featuresSubtitle"></p></div>
  <div class="cards" id="cards"></div>
</section>
<section class="contact" id="contact">
  <div><div class="eyebrow" id="contactEyebrow"></div><h2 id="contactTitle"></h2></div>
  <div class="contact-side"><p id="contactText"></p><a class="btn" id="contactButton"></a></div>
</section>
</main>
<footer><span id="footerText"></span><a href="/admin.html">Админка ↗</a></footer>
</div>
<script>
const fallback={"brand":"начало","navLabel":"О проекте","eyebrow":"Пространство для идей","title":"Большие идеи начинаются с первого шага.","subtitle":"Лендинг, который можно менять без правки кода: тексты, кнопки, карточки, контакты и цвета управляются из отдельной админки.","primaryButtonText":"Посмотреть возможности","primaryButtonUrl":"#features","secondaryButtonText":"Связаться","secondaryButtonUrl":"#contact","heroBadge":"Редактируется из админки","heroImage":"","stats":[{"value":"01","label":"одна страница"},{"value":"100%","label":"ручное управление"},{"value":"∞","label":"вариантов текста"}],"featuresTitle":"Что можно менять","featuresSubtitle":"Без захода в код","features":[{"number":"01","title":"Тексты","text":"Заголовки, описания, кнопки и подписи — всё редактируется вручную."},{"number":"02","title":"Визуал","text":"Основные цвета, акцент и изображение первого экрана можно заменить из панели."},{"number":"03","title":"Контакты","text":"Меняй финальный призыв к действию и ссылку, куда должен перейти посетитель."}],"contactEyebrow":"Готово к следующему шагу","contactTitle":"Сайт меняется вместе с твоей идеей.","contactText":"Открой админку, поправь контент, посмотри предпросмотр и опубликуй обновление.","contactButtonText":"Открыть админку","contactButtonUrl":"/admin.html","footerText":"© 2026 Начало","colors":{"background":"#f4f1ea","surface":"#fffdf8","text":"#20251f","muted":"#6f746b","accent":"#b9dd68","accentText":"#243016","line":"#d9ddd3"}};
const $=id=>document.getElementById(id);
function setText(id,value){$(id).textContent=value||""}
function applyContent(c){
  const colors={...fallback.colors,...(c.colors||{})};
  const root=document.documentElement.style;
  root.setProperty("--bg",colors.background);root.setProperty("--surface",colors.surface);root.setProperty("--text",colors.text);root.setProperty("--muted",colors.muted);root.setProperty("--accent",colors.accent);root.setProperty("--accentText",colors.accentText);root.setProperty("--line",colors.line);
  setText("brand",c.brand);$("brand").insertAdjacentHTML("beforeend","<i>↗</i>");
  setText("navLabel",c.navLabel);setText("eyebrow",c.eyebrow);setText("title",c.title);setText("subtitle",c.subtitle);setText("heroBadge",c.heroBadge);
  $("primaryButton").textContent=c.primaryButtonText||"";$("primaryButton").href=c.primaryButtonUrl||"#";
  $("secondaryButton").textContent=c.secondaryButtonText||"";$("secondaryButton").href=c.secondaryButtonUrl||"#";
  const image=(c.heroImage||"").trim();$("heroCard").classList.toggle("has-image",!!image);$("heroImage").src=image;$("heroImage").alt=image?(c.title||"Изображение"):"";
  $("stats").innerHTML=(c.stats||[]).map(s=>'<div class="stat"><b>'+escapeHtml(s.value)+'</b><span>'+escapeHtml(s.label)+'</span></div>').join("");
  setText("featuresTitle",c.featuresTitle);setText("featuresSubtitle",c.featuresSubtitle);
  $("cards").innerHTML=(c.features||[]).map(f=>'<article class="card"><span class="num">'+escapeHtml(f.number)+'</span><div><h3>'+escapeHtml(f.title)+'</h3><p>'+escapeHtml(f.text)+'</p></div></article>').join("");
  setText("contactEyebrow",c.contactEyebrow);setText("contactTitle",c.contactTitle);setText("contactText",c.contactText);
  $("contactButton").textContent=c.contactButtonText||"";$("contactButton").href=c.contactButtonUrl||"#";
  setText("footerText",c.footerText);
  document.title=(c.brand||"Начало")+" — лендинг";
  $("loading").remove();
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
fetch("./content.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(c=>applyContent({...fallback,...c})).catch(()=>applyContent(fallback));
</script>
</body>
</html>
