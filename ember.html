<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101416"><meta name="description" content="Пепельное сердце — атмосферный roguelike о последнем огне. Случайные подземелья, реликвии и три босса."><title>Пепельное сердце • Roguelike</title><link rel="stylesheet" href="/ember.css?v=3"></head>
<body><header><a href="/" class="back">← <span>На сайт</span></a><a class="wordmark" href="/ember.html">✦ <span>ПЕПЕЛЬНОЕ СЕРДЦЕ</span></a><div class="actions"><button id="sound" aria-label="Настройки звука" aria-expanded="false" aria-controls="audioSettings">♫ Звук</button><button id="pause" aria-label="Пауза">Ⅱ</button><button id="fullscreen" aria-label="Полный экран">⛶</button></div></header><section id="audioSettings" class="audio-settings" hidden aria-label="Настройки звука"><div class="audio-title"><strong>Звук подземелья</strong><button id="audioClose" aria-label="Закрыть настройки звука">×</button></div><label class="audio-toggle"><span>Включить звук</span><input id="audioEnabled" type="checkbox" checked></label><label for="musicVolume">Музыка <output id="musicValue">32%</output></label><input id="musicVolume" type="range" min="0" max="100" value="32"><label for="effectsVolume">Эффекты <output id="effectsValue">70%</output></label><input id="effectsVolume" type="range" min="0" max="100" value="70"><p>Музыка меняется в бою. Настройки сохраняются.</p></section>
